name: Publish Scenario Data

on:
  schedule:
    - cron: '0/5 * * * *' # Every 5 minutes
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

concurrency:
  group: scenario-data-publisher
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      DATA_OUTPUT_DIR: ${{ runner.temp }}/scenario-data
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Restore the previous published data
        run: >-
          python scripts/publish_scenarios.py bootstrap
          --repo "$GITHUB_REPOSITORY"
          --output-dir "$DATA_OUTPUT_DIR"
          --seed-ref bea7dcdcd815850d0441753bdfb184cd5cb63f7e

      - name: Fetch scenarios
        id: fetch
        run: python scripts/fetch_scenarios.py --min-entries 10 --output-dir "$DATA_OUTPUT_DIR"

      - name: Publish rolling release assets
        run: >-
          python scripts/publish_scenarios.py publish
          --repo "$GITHUB_REPOSITORY"
          --output-dir "$DATA_OUTPUT_DIR"

      - name: Preserve datasets after a publishing failure
        if: failure() && steps.fetch.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: scenario-data-recovery
          path: ${{ env.DATA_OUTPUT_DIR }}/*.json.gz
          retention-days: 7
          if-no-files-found: error
