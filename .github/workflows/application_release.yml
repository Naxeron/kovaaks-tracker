name: Build Application

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # The rolling scenario dataset has its own independent publishing workflow.
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name != 'scenario-data'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install test dependencies
        run: python -m pip install -r requirements/dev.txt
      - name: Check JavaScript syntax
        run: node --check kovaaks/web/script.js
      - name: Run headless regression tests
        run: python -m pytest -q
      - name: Build runtime ZIP
        run: python scripts/build_distribution.py
      - uses: actions/upload-artifact@v7
        with:
          name: kovaaks-tracker
          path: dist/kovaaks-tracker.zip
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'release' && github.event.release.tag_name != 'scenario-data'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: kovaaks-tracker
          path: dist
      - name: Attach runtime ZIP to the application release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/kovaaks-tracker.zip --repo "$GITHUB_REPOSITORY" --clobber
